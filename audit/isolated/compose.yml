name: kavelyq-isolated
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ci-only-never-production
    volumes:
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/bootstrap.sql:ro
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 30
  mail:
    image: axllent/mailpit:v1.31.6
    ports: ['127.0.0.1:8025:8025']
  auth:
    image: supabase/gotrue:v2.196.0
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_started}
    ports: ['127.0.0.1:9999:9999']
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:ci-only-never-production@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://127.0.0.1:4173
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:4173/**
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: isolated-ci-jwt-secret-never-used-in-production-20261016
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_SMTP_ADMIN_EMAIL: test@example.invalid
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: KAVELYQ isolated test
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_URLPATHS_INVITE: /verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /verify
  rest:
    image: postgrest/postgrest:v14.17
    depends_on:
      db: {condition: service_healthy}
    ports: ['127.0.0.1:3000:3000']
    environment:
      PGRST_DB_URI: postgres://authenticator:ci-only-never-production@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_JWT_SECRET: isolated-ci-jwt-secret-never-used-in-production-20261016
