name: Browser regression
on:
  push:
    branches: [release/final-20261015, main]
  workflow_dispatch:
concurrency:
  group: browser-regression-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Start disposable guest backend only
        run: |
          docker compose -f audit/isolated/compose.yml up -d --wait db mail
          docker compose -f audit/isolated/compose.yml up -d auth
          python3 audit/isolated/wait.py http://127.0.0.1:9999/health
          docker compose -f audit/isolated/compose.yml exec -T db psql -U postgres -v ON_ERROR_STOP=1 < audit/isolated/schema.sql
          docker compose -f audit/isolated/compose.yml exec -T db psql -U postgres -v ON_ERROR_STOP=1 < audit/owner-atomic-hours.pending.sql
          docker compose -f audit/isolated/compose.yml exec -T db psql -U postgres -v ON_ERROR_STOP=1 < audit/notification-adapter.pending.sql
          docker compose -f audit/isolated/compose.yml exec -T db psql -U postgres -v ON_ERROR_STOP=1 < audit/isolated/guest-fixtures.sql
          docker compose -f audit/isolated/compose.yml up -d rest
          python3 audit/isolated/wait.py http://127.0.0.1:3000/
      - name: Desktop and touch WebKit guest journeys (no hosted writes)
        run: docker run --rm --ipc=host --network=host -v "$PWD:/work" -w /work/audit/browser mcr.microsoft.com/playwright:v1.64.1-noble bash -c 'npm ci --ignore-scripts --omit=optional && npm test'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-results
          path: |
            audit/browser/results.json
            audit/browser/playwright-report
            audit/browser/test-results
          retention-days: 7
      - name: Remove disposable services
        if: always()
        run: docker compose -f audit/isolated/compose.yml down -v
