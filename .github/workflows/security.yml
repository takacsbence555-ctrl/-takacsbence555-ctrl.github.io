name: Security and release guards
on:
  push:
    branches: [release/final-20261015]
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node audit/release-security.test.cjs
      - run: npm ci --ignore-scripts && npm audit --audit-level=high
        working-directory: audit
      - run: npm ci --ignore-scripts && npm audit --audit-level=high
        working-directory: audit/browser
