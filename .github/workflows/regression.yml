name: Product regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: audit/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: audit
      - run: npm test
        working-directory: audit
      - run: node --check app.js && node --check product-core.js && node --check server/notification-runtime.cjs && node --check api/notification-worker.mjs && node --check api/resend-webhook.mjs
      - run: python3 -m py_compile audit/http.test.py

